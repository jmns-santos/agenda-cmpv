name: Atualizar agenda.ics

on:
  schedule:
    # A cada 4h (horario UTC). Ajusta a vontade - a agenda municipal
    # nao muda de hora a hora.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python gerar_agenda_ics.py --output agenda.ics --log-file agenda.log --horizonte-meses 18 --ttl-horas 4

      - name: Publicar alteracoes (se o conteudo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda.ics
          if git diff --staged --quiet; then
            echo "Sem alteracoes ao conteudo dos eventos, sem commit."
          else
            git commit -m "Atualizar agenda.ics"
            git push
          fi
